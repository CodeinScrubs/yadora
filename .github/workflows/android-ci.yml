# Runs the same gate the project uses locally on every push and pull request: the full JVM unit
# suite (scheduler math, py-fsrs golden vectors, replay == live, migrations, backup round-trip),
# the pilot toolkit replaying a fresh app export exactly, Android lint at zero errors, and both a debug
# build and an R8-minified release build.
#
# The release build is UNSIGNED here on purpose. No keystore or password ever reaches CI:
# app/build.gradle.kts only wires release signing when KEYSTORE_PATH and the passwords exist.
name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'plans/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'plans/**'
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint, debug + release builds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Locally the build runs on Android Studio's bundled JDK. CI uses the Temurin LTS the Android
      # Gradle Plugin and Robolectric are most widely tested on; the app itself targets Java 11.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Pinned to v5 on purpose: gradle/actions v6 moved its caching into a proprietary component, and
      # upgrading means accepting Gradle's Terms of Use (https://gradle.com/legal/terms-of-use/). That
      # is the repository owner's decision, not a version bump. v5 is MIT-licensed and runs on Node 24.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Separate steps so a red run says WHICH gate failed without opening the log.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The pilot toolkit replays every exported review and must reproduce the app's elapsed days,
      # predictions and intervals EXACTLY. PilotExportFixtureTest writes a fresh export from the current
      # Kotlin code (rerun explicitly: a test task restored from the build cache would not write it), so a
      # rule changed in the app but not in tools/pilot/yadora_model.py fails here instead of in a
      # participant's data.
      - name: Pilot toolkit agrees with the app
        run: |
          ./gradlew :app:testDebugUnitTest --tests com.example.data.PilotExportFixtureTest --rerun --stacktrace
          python3 tools/pilot/test_yadora_model.py
          python3 tools/pilot/test_analyze.py
          python3 tools/pilot/analyze.py app/build/pilot-fixture/sample_export.json --out build/pilot-check --no-fit

      - name: Lint (0 errors)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Debug and R8 release builds
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore
